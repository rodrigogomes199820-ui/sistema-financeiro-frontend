<div class="container">

  <div class="box-text">

    <div class="text">
      <h1>Recupere o acesso à sua conta.</h1>

      <p>
        Informe seu e-mail cadastrado para iniciar
        a recuperação da sua senha.
      </p>
    </div>

    <div class="box-img">
      <img
        src="assets/Redefinição.png"
        alt="Ilustração de controle financeiro"
      />
    </div>

  </div>

  <form
    class="form-login"
    [formGroup]="recuperarSenhaForm"
    (ngSubmit)="recuperarSenha()"
  >

    <h2>Esqueceu sua senha?</h2>

    <p>Vamos ajudar você a recuperar seu acesso.</p>

    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>

      <input
        matInput
        type="email"
        placeholder="Digite seu e-mail"
        formControlName="email"
      />

      <mat-error
        *ngIf="recuperarSenhaForm.get('email')?.hasError('required')"
      >
        Informe seu e-mail.
      </mat-error>

      <mat-error
        *ngIf="recuperarSenhaForm.get('email')?.hasError('email')"
      >
        Informe um e-mail válido.
      </mat-error>

    </mat-form-field>

    <button
      mat-raised-button
      class="btn-cana"
      type="submit"
      [disabled]="recuperarSenhaForm.invalid"
    >
      Recuperar senha
    </button>

    <div class="register">
      <a mat-button color="primary" routerLink="/login">
        Voltar para o login
      </a>
    </div>

  </form>

</div>
